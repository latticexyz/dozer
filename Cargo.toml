[package]
    edition = "2021"
    name    = "imud"
    version = "0.1.0"

[dependencies]

    alloy = { git = "https://github.com/alloy-rs/alloy", rev = "25916cd", features = [
        "contract",
        "network",
        "postgres",
        "provider-http",
        "providers",
        "rpc",
        "rpc-types-eth",
        "serde",
        "sol-types",
    ] }
    async-trait = "0.1"
    axum = "0.7.5"
    deadpool-postgres = "0.13.0"
    eyre = "0.6.12"
    ruint = { version = "1.12.1", features = ["postgres"] }
    serde = { version = "1", features = ["derive"] }
    tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
    tokio-postgres = { version = "0.7.10", features = ["array-impls"] }
    tokio-stream = "0.1"
    tower-http = { version = "0.5.0", features = [
        "compression-gzip",
        "compression-zstd",
        "timeout",
        "trace",
    ] }
    tracing = "0.1"
    tracing-subscriber = "0.3"
